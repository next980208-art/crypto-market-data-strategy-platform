name: unit-tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Audit public repository
        run: python scripts/audit_public_repository.py
      - name: Compile Python sources
        run: python -m compileall -q airflow demo examples flink_jobs realtime scripts *.py
      - name: Run unit tests
        run: python -m unittest discover -s tests
